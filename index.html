<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>El Escáner — Potenciación Humana</title>
<style>
:root{--navy:#1B3A5C;--accent:#2E75B6;--amber:#F59E0B;--bg:#F4F6F8;--surface:#FFFFFF;--border:#DDE3EC;--text:#1E293B;--muted:#64748B;--light:#EAF4FB;--green:#10B981;--red:#EF4444;--orange:#E65100}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh}
#topbar{background:var(--navy);color:#fff;padding:10px 24px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
#topbar .brand{display:flex;flex-direction:column;gap:1px}
#topbar .b1{font-size:11px;font-weight:700;letter-spacing:.06em;opacity:.7}
#topbar .b2{font-size:14px;font-weight:700}
#topbar .right{display:flex;align-items:center;gap:10px}
#topbar .phase-label{font-size:12px;opacity:.55}
#prog-wrap{height:3px;background:rgba(255,255,255,.15);position:sticky;top:46px;z-index:99}
#prog-bar{height:100%;background:var(--amber);transition:width .4s;width:0}
#app{max-width:740px;margin:0 auto;padding:28px 20px 100px}
.phase-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:4px}
.phase-title{font-size:22px;font-weight:700;color:var(--navy);margin-bottom:6px}
.phase-desc{font-size:14px;color:var(--muted);margin-bottom:20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:14px}
.btn{padding:10px 22px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:14px;font-weight:500;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--bg)}
.btn.primary{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.primary:hover{opacity:.88}
.btn.amber{background:var(--amber);color:#fff;border-color:var(--amber)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted);font-size:13px;padding:8px 14px}
.btn.ghost:hover{background:var(--bg);color:var(--text)}
.btn:disabled{opacity:.3;cursor:not-allowed}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
/* Questions */
.q-row{padding:16px 0;border-bottom:.5px solid var(--border)}
.q-row:last-child{border-bottom:none}
.q-text{font-size:14px;color:var(--text);margin-bottom:12px;line-height:1.5}
.q-num{font-size:11px;font-weight:700;color:var(--accent);margin-bottom:4px}
/* Frequency scale */
.freq-wrap{display:flex;gap:4px;flex-wrap:wrap}
.fbox{flex:1;min-width:70px;padding:8px 4px;border:1px solid var(--border);border-radius:8px;text-align:center;cursor:pointer;transition:all .12s;user-select:none;background:var(--surface)}
.fbox:hover{border-color:var(--accent);background:var(--light)}
.fbox.sel{background:var(--navy);color:#fff;border-color:var(--navy)}
.fbox .flabel{font-size:11px;font-weight:600;display:block}
.fbox .fdot{width:6px;height:6px;border-radius:50%;background:currentColor;margin:4px auto 0;opacity:.4}
.fbox.sel .fdot{opacity:1;background:#fff}
/* YN */
.yn-wrap{display:flex;gap:8px}
.yn-btn{padding:9px 28px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;transition:all .12s;background:var(--surface);color:var(--muted)}
.yn-btn:hover{border-color:var(--accent);color:var(--accent)}
.yn-btn.sel-si{background:var(--navy);color:#fff;border-color:var(--navy)}
.yn-btn.sel-no{background:#F1F5F9;color:var(--muted);border-color:var(--border)}
/* Qty */
.qty-wrap{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.qty-input{width:90px;padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:15px;font-weight:600;color:var(--text);text-align:center}
.qty-input:focus{outline:none;border-color:var(--accent)}
.qty-unit{font-size:13px;color:var(--muted)}
/* ND */
.nd-label{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);cursor:pointer}
.nd-label input{accent-color:var(--muted)}
.q-controls.disabled .freq-wrap,.q-controls.disabled .yn-wrap,.q-controls.disabled .qty-wrap{opacity:.25;pointer-events:none}
/* Phase 2 */
.q-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.q-counter{font-size:13px;color:var(--muted)}
.score-badge{background:var(--navy);color:#fff;font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px;display:inline-block}
.cause-opt{padding:12px 16px;margin:6px 0;border:1px solid var(--border);border-radius:8px;cursor:pointer;display:flex;gap:12px;align-items:flex-start;transition:border-color .12s,background .12s}
.cause-opt:hover{border-color:var(--accent);background:var(--light)}
.cause-opt.on{border-color:var(--navy);background:var(--light)}
.cause-opt input[type=checkbox]{margin-top:3px;accent-color:var(--navy);min-width:16px;cursor:pointer;flex-shrink:0}
.cause-text{font-size:13px;color:var(--text);line-height:1.5}
/* Diagnosis */
.diag-bar-wrap{background:#E2E8F0;border-radius:3px;height:7px;margin:8px 0}
.diag-bar{height:100%;border-radius:3px}
.diag-cause{padding:14px 16px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px}
.sc-card{padding:14px 18px;border-left:4px solid var(--navy);border-radius:0 8px 8px 0;margin-bottom:8px}
.blind-item{padding:8px 14px;border:1px dashed var(--border);border-radius:8px;margin-bottom:6px;font-size:13px;color:var(--muted)}
.callout{padding:12px 18px;background:#FEF9EC;border-left:4px solid var(--amber);border-radius:0 8px 8px 0;font-size:13px;color:#92400E;margin:14px 0}
.callout.info{background:var(--light);border-left-color:var(--accent);color:#1e3a5c}
.results-table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
.results-table th{padding:8px 10px;text-align:left;border-bottom:1px solid var(--border);color:var(--muted);font-weight:600}
.results-table td{padding:7px 10px;border-bottom:.5px solid var(--border);vertical-align:top}
/* Save bar */
#save-bar{position:fixed;bottom:0;left:0;right:0;background:rgba(27,58,92,.97);padding:10px 24px;display:flex;justify-content:center;gap:10px;z-index:200;backdrop-filter:blur(4px)}
.intro-steps{display:grid;gap:12px;margin:18px 0}
.step{display:flex;gap:14px;align-items:flex-start}
.step-num{min-width:26px;height:26px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.step-text{font-size:14px;color:var(--muted);padding-top:3px}
#copy-area{position:fixed;left:-9999px}
input[type=file]{display:none}
</style>
</head>
<body>
<div id="topbar">
  <div class="brand"><div class="b1">Potenciación Humana</div><div class="b2">El Escáner</div></div>
  <div class="right"><span class="phase-label" id="phase-ind"></span></div>
</div>
<div id="prog-wrap"><div id="prog-bar"></div></div>
<div id="app"></div>
<div id="save-bar" style="display:none">
  <button class="btn ghost" style="color:#fff;border-color:rgba(255,255,255,.2)" onclick="saveProgress()">💾 Guardar progreso</button>
</div>
<textarea id="copy-area"></textarea>
<input type="file" id="file-input" accept=".json" onchange="loadProgress(this)">
<script>

const QS=[

const CR_CTX={
  Q01:{CR07:"Suelo descuidar mi alimentación y por ello mi cerebro responde mal",CR06:"Suelo comer lo que tengo cerca en el momento, sin considerar cómo eso va a afectar mi cerebro en las próximas horas",CR17:"Suelo seguir trabajando aunque mi capacidad real ha bajado, confundiendo presencia con productividad"},
  Q02:{CR07:"Soy consciente de que las pantallas, el móvil o las cenas tardías comprometen mi sueño, pero en el momento tiendo a minimizarlo — y luego suelo notarlo al día siguiente",CR02:"Mi rutina nocturna se ha configurado sola — pantallas en la cama, móvil en la mesilla, cena cuando toca — y nunca la he diseñado conscientemente",CR08:"Mi cerebro suele pedir un último estímulo antes de dormir y el móvil siempre está a mano para darlo",CR09:"Suelo usar las pantallas o el móvil para aplazar el momento de quedarme solo con mis pensamientos"},
  Q03:{CR07:"Suelo usar la cafeína como sustituto de un descanso real que no estoy obteniendo",CR06:"Suelo tirar de café para sostener tareas que en realidad no merecen ese esfuerzo de mantenimiento",CR09:"Suelo recurrir al café cuando toca trabajo difícil — el ritual de prepararlo y tomarlo aplaza el momento incómodo de empezar",CR17:"Tiendo a confundir estar activo y estimulado con estar rindiendo de forma efectiva"},
  Q04:{CR07:"El aire y los descansos no son algo en lo que repare — los doy por descontado y priorizo otras cosas",CR02:"Soy consciente de que debería ventilar y levantarme, pero por hábito no lo hago — sigo sentado hasta que algo me obliga"},
  Q05:{CR07:"Mi forma de comer genera oscilaciones de glucosa que disparan el impulso de volver a comer aunque no haya hambre real",CR13:"Suelo abrir la nevera o picar para anestesiar un estrés o una incomodidad que no quiero pararme a descifrar",CR09:"Levantarme a picar es la forma cómoda de pausar el trabajo que tengo delante sin reconocer que lo estoy aplazando",CR08:"Picar o buscar comida es otro estímulo cuando el cerebro busca cualquier cosa que rompa el aburrimiento o la tensión"},
  Q06:{CR13:"Comer suele ser la herramienta a mano cuando hay carga emocional que no sé dónde colocar",CR07:"Mi base fisiológica está lo suficientemente desregulada como para confundir estrés o aburrimiento con hambre",CR09:"Comer me da la pausa que evita seguir con lo que tengo entre manos — y me cuesta reconocerlo como evitación",CR08:"Comer es otro estímulo cuando el cerebro busca cualquier cosa que rompa el aburrimiento"},
  Q07:{CR07:"Suelo subestimar el efecto del alcohol sobre el sueño y la energía base — el coste se acumula aunque la copa parezca puntual",CR13:"Suelo usar el alcohol para anestesiar un estrés o una incomodidad que no quiero pararme a descifrar",CR09:"Suelo recurrir al alcohol como forma rápida de aplazar la incomodidad acumulada del día — y nunca me he detenido a ver qué hay debajo",CR15:"Mi entorno social normaliza beber con frecuencia, así que no aparece como decisión que tomo — aparece como lo que toca"},
  Q08:{CR07:"Suelo restarle importancia al efecto del consumo sobre el sueño, la concentración y la energía base — y luego me sorprende rendir peor de lo que creo",CR13:"Suelo usar el consumo para anestesiar un estrés o una incomodidad que no quiero pararme a descifrar",CR09:"Es la salida cómoda en los momentos de incomodidad o aburrimiento — y nunca me he detenido a ver qué hay debajo",CR15:"Mi entorno consume y eso normaliza el hábito sin que aparezca como elección consciente"},
  Q09:{CR09:"Suelo recurrir a esa conducta porque es la herramienta más eficaz que tengo para evitar la incomodidad cuando aparece",CR13:"Es mi forma rápida y barata de anestesiarme cuando me siento superado, ansioso o vacío — y no quiero lidiar con ello",CR08:"Es el estímulo más fuerte que mi cerebro encuentra cuando no quiere sostener foco — y sabe exactamente dónde buscarlo",CR25:"Suelo usarla para inducirme un estado en el que sí pueda funcionar después — la justifico como combustible"},
  Q10:{CR05:"Suelo aceptar porque en el momento todo parece igual de importante",CR19:"Cada vez que llega una petición tiendo a evaluarla desde cero — y en caliente casi siempre digo que sí o aplazo el no",CR11:"Me cuesta decir no porque tengo construida una imagen de persona dispuesta y colaboradora, y decirlo la cuestionaría",CR20:"Suelo decir que mi tiempo es valioso pero lo entrego sin filtro a quien me lo pide"},
  Q11:{CR09:"Perfeccionar detalles es más cómodo que enfrentarme a la tarea de mayor impacto",CR21:"El resultado final es incierto — ajustar detalles me da sensación de control, pero es falso",CR06:"Suelo gastar mi mejor atención en detalles que no van a devolverme ese esfuerzo — energía premium en output marginal"},
  Q12:{CR13:"Suelo darle vueltas porque el problema lleva una carga emocional que no estoy procesando — la rumiación es la forma de tocarla sin tocarla",CR09:"La rumiación se siente como trabajar en el problema, aunque en realidad con frecuencia evita la acción real",CR25:"Suelo actuar solo cuando me siento preparado emocionalmente — mientras, doy vueltas",CR21:"El problema tiene incertidumbre y darle vueltas me da la ilusión de reducirla"},
  Q13:{CR15:"En mi entorno cercano hay personas que normalizan la queja, la dispersión y la falta de exigencia",CR11:"Aunque no me gusta la toxicidad, tengo construida una imagen de persona generosa y disponible, y poner límites la cuestionaría",CR20:"Suelo decir que el entorno importa pero sigo eligiendo pasar tiempo con personas que me restan",CR05:"Suelo dedicar tiempo a quien me lo pide sin filtrar si esa persona me aporta o me resta"},
  Q14:{CR05:"Suelo apuntarme a todo lo que parece interesante porque no tengo claro qué necesito aprender ahora — y consumir es más cómodo que decidirlo",CR08:"La novedad de un curso, libro o podcast suele activar mi interés independientemente de si lo necesito",CR26:"Suelo consumir contenido compulsivamente porque no tengo claro adónde voy — aprender me da la falsa sensación de avanzar",CR19:"Suelo decidir a qué asistir o qué consumir en el momento en que lo veo, sin filtro previo que lo frene"},
  Q15:{CR09:"Visualizar el resultado es más cómodo que enfrentarme al proceso de trabajo real",CR08:"Imaginar el resultado me da un pequeño subidón que sacia el impulso, aunque luego me cuesta más arrancar el trabajo de verdad",CR25:"Tiendo a necesitar sentirme motivado por el resultado para ponerme a trabajar en el proceso",CR17:"Tiendo a sentir que pensar en el proyecto es avanzar en el proyecto"},
  Q16:{CR11:"Tengo construida una imagen de persona que cumple con los demás — los compromisos conmigo mismo no la sostienen, así que no les doy el mismo peso",CR20:"Cumplo lo que prometo a otros pero negocio con lo que me prometo a mí — la brecha está en cómo trato uno y otro compromiso",CR25:"Suelo cumplir los compromisos cuando estoy motivado, pero no cuando no me apetece",CR09:"Incumplir el compromiso es más cómodo que el esfuerzo que requiere cumplirlo"},
  Q17:{CR02:"El móvil ocupa el lugar que ocupa por defecto — visible, con notificaciones, en la mesa, en la mesilla — y nunca he decidido sacarlo de ahí",CR08:"Tener el móvil siempre presente alimenta el patrón de buscar estímulo en él sin que llegue a ser una decisión",CR09:"Tener el móvil cerca me da una vía de escape inmediata cuando la tarea se complica o la conversación me incomoda"},
  Q18:{CR08:"Mi cerebro suele pedir dopamina barata; acabo desbloqueando la pantalla sin pensarlo, solo para sentir que pasa algo nuevo",CR09:"Suelo abrirlo cuando la tarea que tengo delante genera incomodidad o aburrimiento",CR02:"El móvil siempre está accesible — no hay fricción que frene el impulso de abrirlo",CR21:"Suelo abrirlo cuando tengo algo incierto por delante como forma de aliviar esa tensión"},
  Q19:{CR04:"Tengo tantos frentes activos y no sé en cuál centrarme, así que los alterno",CR08:"Alternar entre tareas y ventanas suele satisfacer la necesidad de novedad de mi cerebro — cada salto es un microestímulo",CR09:"Suelo hacer varias cosas a la vez porque me hace sentir productivo — y me sirve de excusa perfecta para no enfrentarme a lo aburrido o difícil que es centrarme en una sola",CR17:"Cuanto más activo estoy, más siento que estoy siendo productivo"},
  Q20:{CR02:"El calendario y sus notificaciones funcionan por defecto, no según mis necesidades",CR01:"Nunca he invertido 10 minutos en configurar cuándo y cómo quiero que el calendario me avise",CR10:"No tengo un momento del día para procesar avisos en bloque — todo me llega cuando salta y me saca de lo que estaba haciendo"},
  Q21:{CR02:"Suelo improvisar con las contraseñas cada vez — y cada bloqueo o recuperación es tiempo y foco perdido que acabo aceptando como normal",CR23:"Suelo confiar en mi memoria para recordar contraseñas en vez de usar un sistema externo fiable",CR01:"Suelo guardar las contraseñas en la cabeza, en notas de papel o en ningún sitio — y pago el precio cada vez que necesito una",CR09:"Recuperar contraseñas es la micro-excusa perfecta para retrasar 5 minutos más el inicio de la tarea difícil"},
  Q22:{CR02:"WhatsApp y email funcionan por defecto en tiempo real porque nunca he decidido otra cosa activamente",CR01:"Sin sistema de captura, suelo reabrir el mismo mensaje varias veces porque la primera vez no decidí qué hacer con él",CR09:"Responder al instante o reabrir el mensaje difícil es más cómodo que el trabajo de fondo que tengo por delante",CR08:"Cada mensaje nuevo activa el impulso de responder de forma inmediata — un estímulo que mi cerebro prefiere al foco"},
  Q23:{CR02:"El chat de grupo se ha convertido en el canal por defecto también para decidir — sin haber decidido yo que sirviera para eso",CR19:"Suelo mandar la decisión al grupo porque evito tomar la responsabilidad de decidir yo solo",CR04:"Suelo abrir más hilos de los que puedo cerrar — cada decisión colectiva pendiente queda viva en mi cabeza hasta que el grupo se mueve",CR05:"Suelo mandar al grupo lo que podría decidir yo en 30 segundos, y espero días a que alguien lo haga"},
  Q24:{CR01:"Si no apunto en mi sistema que tengo que responderlo, vuelve a aparecer cada vez que abro la app — y la incomodidad se renueva sin avanzar",CR21:"La incertidumbre sobre cómo va a reaccionar la otra persona suele paralizarme",CR09:"Abrir el mensaje y cerrarlo es una forma de lidiar con la incomodidad sin resolverla",CR13:"Hay carga emocional real asociada a esa conversación y suelo evitarla"},
  Q25:{CR08:"El feed está diseñado para activar el impulso de seguir scrolleando con cada item nuevo — y suelo morderlo",CR02:"Suelo usar las redes como fuente de información y referencia por defecto, sin haber decidido alternativas",CR09:"Mirar el feed es más accesible y estimulante que cualquier otra fuente de información más densa",CR16:"Suelo inyectar ruido digital en mi cabeza para no tener que lidiar con el silencio que exige pensar de verdad"},
  Q26:{CR02:"Suelo consumir noticias en cualquier momento porque el acceso no tiene barreras ni horario",CR05:"Suelo consumir noticias porque aparecen, no porque las haya elegido — el algoritmo decide qué me preocupa hoy",CR08:"Las noticias me dan un microbocado emocional que mi cerebro persigue — más que información, busco la activación",CR13:"Suelo usar el drama de las noticias para anestesiar mis propias ansiedades y problemas sin resolver"},
  Q27:{CR02:"Suelo entrar al streaming o a la app de música sin saber qué quiero, y dejo que el algoritmo decida por mí",CR05:"Sin un criterio previo, todas las opciones parecen igual de válidas — y eso me deja paralizado los primeros minutos",CR08:"Suelo pasar más tiempo buscando la opción perfecta que viéndola — el simple hecho de buscar me da un pequeño subidón y no me exige comprometerme con nada",CR19:"Suelo decidir qué consumir cada vez desde cero — el ocio tampoco tiene sistema"},
  Q28:{CR02:"Poner algo de fondo es el hábito por defecto al ponerme a trabajar",CR17:"Tener algo sonando me da sensación de entorno productivo — aunque la calidad del trabajo sea peor que en silencio",CR08:"El silencio suele generarme incomodidad — necesito estímulo de fondo para arrancar"},
  Q29:{CR08:"Cada item nuevo en el scroll me da un microestímulo que mi cerebro persigue — y por eso no sé parar",CR09:"Suelo iniciarlo cuando la tarea que tenía por delante genera incomodidad o aburrimiento",CR02:"El acceso al scroll no tiene fricción — está siempre disponible en el bolsillo",CR21:"El scroll me da sensación de control cuando tengo algo incierto por delante"},
  Q30:{CR05:"Suelo entrar a reuniones sin saber qué quiero sacar de ellas — y salgo sin saber si las necesitaba",CR15:"Mi entorno normaliza las reuniones sin agenda como forma habitual de trabajar",CR19:"Suelo aceptar reuniones sin exigir agenda porque rechazarlas o pedirla me incomoda más que asistir",CR14:"Suelo asistir a reuniones que podrían resolverse con un mensaje o delegarse a otro"},
  Q31:{CR06:"No suelo gestionar mi energía en función del tipo de tarea — todo tiene el mismo peso",CR05:"Suelo usar mis mejores horas en reuniones y emails porque son lo que llega primero, no porque sean lo más importante",CR17:"Responder emails y atender reuniones se siente como trabajar aunque no sea lo de mayor impacto",CR12:"No mido qué produce mis mejores resultados — no sé cuándo estoy en mi mejor momento"},
  Q32:{CR09:"Reorganizar o ajustar la app de productividad es más cómodo que enfrentarme al trabajo real que ya tenía planificado",CR17:"Replanificar y tener un sistema bien organizado me da sensación de productividad aunque no haya producido nada",CR08:"Un plan nuevo o una app reorganizada activa el entusiasmo que el trabajo repetitivo no me da",CR21:"Ejecutar implica un resultado incierto que no controlo — replanificar me da una sensación de control que en realidad es falsa"},
  Q33:{CR04:"Tengo tantos frentes activos y no sé en cuál centrarme, así que los alterno",CR06:"Tiendo a no respetar los momentos de mayor energía para trabajo profundo y los fragmento",CR05:"Suelo saltar al frente más urgente o más visible en ese momento, aunque no sea el más importante",CR18:"Suelo cambiar de tarea antes de terminar ninguna — y así ninguna avanza realmente"},
  Q34:{CR10:"Suelo empezar la semana y los bloques sin haber decidido qué hacer — y acabo haciendo lo más fácil o urgente",CR01:"Mis tareas están dispersas entre el email, el chat, la agenda y la cabeza — no hay un único sitio que me diga qué toca ahora",CR05:"Cada mañana suelo decidir qué hacer desde cero — y en caliente siempre gana lo urgente sobre lo importante",CR24:"Suelo funcionar con prioridades del momento o de la semana pasada en vez de decisiones tomadas en frío"},
  Q35:{CR02:"Cualquiera puede interrumpirme en cualquier momento y suelo permitirlo — nunca he dejado claro cuándo estoy disponible",CR15:"En mi entorno de trabajo o casa, interrumpir sin avisar se da por hecho — y yo lo he aceptado tácitamente al no decir lo contrario",CR04:"Cada interrupción suma un frente nuevo a los que ya tenía abiertos — y vuelvo a la tarea original con menos foco del que tenía"},
  Q36:{CR01:"Suelo rehacer desde cero tareas que ya he hecho decenas de veces — y nunca me he detenido a crear una plantilla",CR02:"Acabo invirtiendo tiempo en hacer lo mismo una y otra vez cuando podría haberlo resuelto una sola vez",CR10:"Cada tarea recurrente empieza con la misma pregunta — ¿por dónde empiezo? — aunque ya la haya respondido antes",CR23:"Suelo confiar en recordar cómo hacía la tarea la última vez — y eso consume energía innecesaria"},
  Q37:{CR02:"Mi vida cotidiana funciona por defecto — ropa, comida, ejercicio, salir de casa — todo se decide en el momento porque nunca diseñé el sistema",CR01:"Sin sistemas que automaticen decisiones repetitivas, cada día empieza con N micro-elecciones que me cuestan energía mental",CR17:"Suelo dedicar energía mental a decidir qué ponerme, qué comer o si entrenar — decisiones que podrían estar resueltas y me hacen sentir activo sin serlo",CR23:"Suelo confiar en improvisar y acordarme — y cada día gasto energía mental en cosas que podrían estar resueltas"},
  Q38:{CR01:"Lo que tengo que hacer vive en mi cabeza, no en un sistema externo donde lo pueda confiar — y pierdo ideas y tareas todos los días",CR23:"Suelo confiar en que me acordaré cuando haga falta — y muchos pendientes desaparecen del radar antes de ese momento",CR04:"Cada pendiente no capturado es un frente cognitivo abierto que consume recursos en segundo plano"},
  Q39:{CR01:"Las pestañas hacen de sistema de captura de emergencia — entra todo y no sale nada porque no tengo otro sitio donde meter ese contenido",CR09:"Abrir una pestaña es más fácil que decidir en el momento si ese contenido vale mi tiempo",CR08:"Abrir pestañas de contenido nuevo satisface el impulso de novedad sin el compromiso de leer"},
  Q40:{CR01:"Las conversaciones pendientes no están en ningún sistema — viven sueltas en mi cabeza y reaparecen sin que yo las llame",CR13:"Hay carga emocional asociada a esas conversaciones y suelo evitarlas activamente",CR09:"Tener o cerrar la conversación requiere un esfuerzo incómodo que suelo posponer",CR21:"No sé cómo van a salir esas conversaciones, y esa incertidumbre me lleva a posponerlas en vez de cerrarlas"},
  Q41:{CR01:"Esos objetos y espacios pendientes no están en ningún sistema — cada vez los veo y vuelven a aparecer en mi cabeza sin que yo los llame",CR02:"Mi espacio se ha llenado por defecto — los objetos acumulados, los cajones desordenados y los pendientes son el resultado de no haber decidido nada",CR09:"Resolver qué hacer con cada uno requiere decisiones incómodas que suelo posponer — y mirar hacia otro lado es más fácil"},
  Q42:{CR01:"Los planes sin fecha no aterrizan en mi calendario — flotan en notas mentales que se diluyen hasta que alguien escribe primero",CR19:"Suelo dejar los planes abiertos porque concretarlos requiere una decisión que prefiero diferir",CR23:"Suelo confiar en que lo recordaré y lo concretaré — y raramente ocurre"},
  Q43:{CR05:"Sin criterio sobre qué me apetece o cuánto tiempo quiero dedicar, evito decidir",CR19:"No tengo un hábito de proponer — suelo esperar a que otro tome la iniciativa",CR02:"En mis dinámicas sociales se ha consolidado por defecto que la propuesta la haga siempre el otro — y nunca he decidido cambiarlo",CR09:"Proponer me obliga a exponerme a un no — esperar a que otro decida me ahorra esa incomodidad"},
  Q44:{CR19:"No tengo claro qué decisiones son mías y cuáles debo devolver a quien corresponde",CR05:"Suelo asumir decisiones que no son mías porque devolvérselas al otro me parece más difícil que resolverlas yo",CR14:"Suelo resolver lo que otros podrían resolver porque es más rápido que explicar o delegar",CR11:"Me cuesta decir que algo no me corresponde porque tengo construida una imagen de persona resolutiva, y delegar la cuestionaría"},
  Q45:{CR02:"Nunca he acordado con mis hijos cuándo pueden interrumpirme — así que lo hacen siempre",CR04:"Como tengo muchos frentes abiertos a la vez, los hijos también pueden interrumpir cualquiera de ellos — el desorden mío les hace pensar que cualquier momento sirve",CR01:"Mis hijos no saben cuándo pueden interrumpirme porque yo tampoco lo tengo definido"},
  Q46:{CR01:"La gestión familiar no tiene sistema externo — se lleva en la cabeza o se improvisa",CR04:"La gestión familiar entra como un frente más a competir con los del trabajo — y al no estar capturada en sistema, gana siempre la que recuerde primero",CR14:"Suelo gestionar personalmente cosas que podrían estar sistematizadas o repartidas"},
  Q47:{CR13:"Suelo trabajar arrastrando una culpa que no nombro — y eso degrada tanto la atención al trabajo como la presencia con la familia",CR20:"Digo que el tiempo personal y la familia son prioridad, pero en la práctica dejo que el trabajo me robe la atención — y luego me siento culpable",CR11:"Tengo construida una imagen de buen padre que se cuestiona cada vez que me ve trabajando en mi tiempo personal",CR09:"Sigo trabajando aunque siento culpa porque parar y mirar de frente esa culpa es más incómodo todavía"},
  Q48:{CR04:"Suelo usar los fragmentos de 45 minutos como excusa perfecta para no hacer trabajo profundo, convenciéndome de que no hay tiempo suficiente",CR06:"Cuando llega el hueco de energía buena, lo gasto en lo primero que reclama urgencia — no en lo que más rendimiento daría",CR01:"Suelo usar los fragmentos de tiempo en lo primero que aparece — y al final del día no ha avanzado nada importante"},
  Q49:{CR01:"Suelo mirar el saldo y no sé si ese dinero es mío o ya está comprometido en algo — y vivo con esa ambigüedad",CR05:"Suelo gastar sin saber exactamente cuánto tengo libre — y a veces la cuenta me da la sorpresa",CR09:"Suelo evitar asignar el dinero porque sentarme a mirar la realidad de mis cuentas me genera una incomodidad que prefiero aplazar"},
  Q50:{CR01:"Suelo ahorrar lo que sobra al final del mes — y casi nunca sobra nada",CR02:"La decisión de cuánto ahorrar se toma cada mes en caliente — no está sistematizada",CR05:"Cada mes el ahorro compite con el gasto — y el gasto casi siempre tiene más argumentos en caliente"},
  Q51:{CR01:"Suelo pagar suscripciones que no uso porque cancelarlas requiere 5 minutos que siempre postergo",CR09:"Cancelar requiere un pequeño esfuerzo incómodo que siempre se pospone",CR05:"Sin criterio claro de qué me aporta valor, suelo mantener todo por si acaso"},
  Q52:{CR05:"Suelo entrar a comprar sin haber decidido qué quiero exactamente — y el proceso de elegir se convierte en el objetivo",CR08:"Tiendo a engañarme pensando que soy un comprador analítico, cuando en realidad soy más bien adicto al pequeño subidón que da seguir buscando",CR02:"Suelo comprar y revisar precios según lo que veo en el momento, no según lo que había decidido necesitar",CR19:"Suelo decidir qué comprar y cuándo cerrar la compra en el punto de compra — el peor momento para tomar esas decisiones"},
  Q53:{CR13:"Saber que hay algo pendiente sin tocar me genera una carga emocional de fondo — y al no abrirlo, la carga sigue ahí intacta",CR09:"Revisar las deudas o cuentas pendientes requiere enfrentarse a algo incómodo",CR21:"La incertidumbre sobre el estado real de esas cuentas suele paralizarme en vez de activarme",CR05:"Suelo evitar mirar las cuentas pendientes — y cada día que pasa la incomodidad de abrirlas crece"},
  Q54:{CR08:"Tiendo a mirar las gráficas compulsivamente para sentir la emoción de que pasan cosas, en lugar de hacer el trabajo aburrido que realmente mueve la aguja",CR22:"Tiendo a confundir monitorizar información con tomar decisiones — son cosas distintas",CR05:"Suelo revisar las métricas varias veces al día aunque sé que no voy a actuar — por si acaso",CR09:"Revisar métricas es más inmediato y cómodo que el trabajo de mayor impacto"},

// ─── ESTADO ───────────────────────────────────────────────────────────────────
const st={phase:0,kidsFilter:null,ans:{},nd:new Set(),causes:{},idx:0,shuffled:null};

// ─── LÓGICA ───────────────────────────────────────────────────────────────────
function isAlarm(q){
  if(st.nd.has(q.id)&&q.nd) return true;
  const v=st.ans[q.id];
  if(v===undefined||v===null) return false;
  if(q.tipo==='scale') return v>=SCALE_THRESH;
  if(q.tipo==='yn') return v==='si';
  if(q.tipo==='yn-inv') return v==='no';
  if(q.tipo==='qty'){
    const n=parseFloat(v);
    if(isNaN(n)) return false;
    return q.tdir==='gt'?n>q.thresh:n<q.thresh;
  }
  return false;
}
function getScore(q){
  if(st.nd.has(q.id)&&q.nd) return 8;
  const v=st.ans[q.id];
  if(q.tipo==='scale') return v||0;
  if(q.tipo==='yn'||q.tipo==='yn-inv') return isAlarm(q)?8:1;
  if(q.tipo==='qty') return isAlarm(q)?8:0;
  return 0;
}
function getAlarmQs(){return (st.shuffled||QS).filter(q=>isAlarm(q));}
function getNdAlarmQs(){return QS.filter(q=>st.nd.has(q.id)&&q.nd);}

function computeDiag(){
  const aq=getAlarmQs();
  const weights={};
  aq.forEach(q=>{
    const score=getScore(q);
    (st.causes[q.id]||[]).forEach(cr=>{weights[cr]=(weights[cr]||0)+score;});
  });
  const crSat={};
  const activeCR_MAX=st.kidsFilter===false?CR_MAX_NOKIDS:CR_MAX;
  Object.keys(weights).forEach(cr=>{
    crSat[cr]=Math.min(Math.round(weights[cr]/(activeCR_MAX[cr]||1)*100),100);
  });
  const topCR=Object.entries(crSat).sort((a,b)=>b[1]-a[1]);
  const scW={};
  Object.entries(SC).forEach(([sid,sv])=>{
    sv.cs.forEach(cr=>{if(weights[cr]) scW[sid]=(scW[sid]||0)+weights[cr];});
  });
  const scSat={};
  Object.entries(SC).forEach(([sid])=>{
    const maxBase=SC_MAX_BASE[sid]||1;
    const maxP=st.kidsFilter===false?(SC_MAX_NOKIDS[sid]||maxBase):maxBase;
    scSat[sid]=Math.min(Math.round((scW[sid]||0)/maxP*100),100);
  });
  const topSC=Object.entries(scSat).sort((a,b)=>b[1]-a[1]);
  const maxSat=topSC[0]?topSC[0][1]:0;
  return{topCR,topSC,scSat,crSat,weights,isStructural:maxSat>=40,maxSat};
}

// ─── SAVE / LOAD ──────────────────────────────────────────────────────────────
function saveProgress(){
  const data={
    v:1,
    saved:new Date().toISOString(),
    phase:st.phase,
    kidsFilter:st.kidsFilter,
    ans:st.ans,
    nd:[...st.nd],
    causes:st.causes,
    idx:st.idx,
    shuffledIds:st.shuffled?st.shuffled.map(q=>q.id):null
  };
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download='escaner_progreso.json';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function loadProgress(input){
  const file=input.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const data=JSON.parse(e.target.result);
      if(!data.v) throw new Error('Formato inválido');
      st.phase=data.phase||0;
      st.kidsFilter=data.kidsFilter;
      st.ans=data.ans||{};
      st.nd=new Set(data.nd||[]);
      st.causes=data.causes||{};
      st.idx=data.idx||0;
      if(data.shuffledIds){
        const map=Object.fromEntries(QS.map(q=>[q.id,q]));
        st.shuffled=data.shuffledIds.map(id=>map[id]).filter(Boolean);
      } else {
        st.shuffled=null;
      }
      render();
    } catch(err){
      alert('El archivo no es válido o está dañado.');
    }
  };
  reader.readAsText(file);
  input.value='';
}

// ─── RENDER ───────────────────────────────────────────────────────────────────
function setProgress(p){
  document.getElementById('prog-bar').style.width=p+'%';
  const labels={0:'',0.5:'Filtro inicial',1:'Fase 1 — Situaciones',2:'Fase 2 — Causas',3:'Diagnóstico'};
  document.getElementById('phase-ind').textContent=labels[st.phase]||'';
  document.getElementById('save-bar').style.display=(st.phase>=1&&st.phase<3)?'flex':'none';
}
function render(){
  const el=document.getElementById('app');
  if(st.phase===0){el.innerHTML=renderP0();setProgress(0);}
  else if(st.phase===0.5){el.innerHTML=renderKids();setProgress(5);attachKids();}
  else if(st.phase===1){el.innerHTML=renderP1();setProgress(20);attachP1();}
  else if(st.phase===2){
    const aq=getAlarmQs();
    if(st.idx>=aq.length){st.phase=3;render();return;}
    el.innerHTML=renderP2();setProgress(70);attachP2();
  }
  else{el.innerHTML=renderP3();setProgress(100);}
  window.scrollTo(0,0);
}

function countPending(){
  if(!st.shuffled) return 0;

      const barColor=pct>=60?'#8B1A1A':pct>=40?'#F59E0B':'#2E75B6';
      html+=`<div class="diag-cause">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
      <div style="display:flex;align-items:center;gap:10px">
      <span style="font-size:18px;font-weight:700;color:var(--muted)">${i+1}</span>
      <div><div style="font-size:14px;font-weight:700;color:${sv.color}">${sv.name}</div>
      ${pct>=40?`<div style="font-size:12px;color:var(--muted);margin-top:2px">El ${pct}% ${SC_FRAME[sid]}</div>`:''}
      </div></div>
      <span style="font-size:24px;font-weight:800;color:${barColor}">${pct}%</span>
      </div>
      <div class="diag-bar-wrap"><div class="diag-bar" style="width:${pct}%;background:${barColor}"></div></div>
      </div>`;
    });

    html+=`<h3 style="font-size:15px;font-weight:700;color:var(--navy);margin:20px 0 10px">Causas raíz — vectores dominantes</h3>`;
    diag.topCR.slice(0,6).forEach(([cr,pct],i)=>{
      if(pct===0) return;
      html+=`<div style="padding:10px 14px;border:1px solid var(--border);border-radius:8px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center">
      <span style="font-size:13px;flex:1">${CR[cr]}</span>
      <span style="font-size:18px;font-weight:800;color:var(--navy);margin-left:12px">${pct}%</span>
      </div>`;
    });

    html+=`<h3 style="font-size:15px;font-weight:700;color:var(--navy);margin:20px 0 10px">Situaciones de alta intensidad</h3>
    <table class="results-table"><tr><th>#</th><th>Situación</th><th>Respuesta</th></tr>`;
    aq.forEach(q=>{
      const t=q.tipo||'';
      const val=st.nd.has(q.id)?'Sin datos':
        t==='scale'?`${FREQ.find(f=>f.val===st.ans[q.id])?.label||st.ans[q.id]}`:
        (t==='yn'||t==='yn-inv')?(st.ans[q.id]==='si'?'Sí':'No'):
        `${st.ans[q.id]} ${q.unit||''}`;
      html+=`<tr><td style="font-weight:700;color:var(--muted);font-size:11px">${q.id}</td>
      <td>${q.q}</td><td style="font-weight:600;white-space:nowrap">${val}</td></tr>`;
    });
    html+=`</table>`;
  }

  if(ndAq.length){
    html+=`<h3 style="font-size:15px;font-weight:700;color:var(--navy);margin:20px 0 10px">Áreas sin datos — investiga antes de descartar</h3>`;
    ndAq.forEach(q=>{html+=`<div class="blind-item">${q.id} — ${q.q}</div>`;});
  }

  html+=`<div class="btn-row" style="margin-top:28px">
  <button class="btn primary" onclick="downloadReport()">Descargar informe</button>
  <button class="btn amber" onclick="copyForClaude()">Copiar para Claude</button>
  <button class="btn" onclick="resetAndConfirm()">Reiniciar</button>
  </div>`;
  return html;
}

function resetState(){
  Object.assign(st,{phase:0,kidsFilter:null,ans:{},nd:new Set(),causes:{},idx:0,shuffled:null});
}

// ─── EXPORT ───────────────────────────────────────────────────────────────────
function copyForClaude(){
  const diag=computeDiag();
  const aq=getAlarmQs();
  let t='RESULTADOS — EL ESCÁNER / POTENCIACIÓN HUMANA\n';
  t+=`Tipo: ${diag.isStructural?'Estructural (≥40%)':'Micro-fugas (<40%)'}\n\n`;
  t+='SUPER-CAUSAS:\n';
  diag.topSC.forEach(([sid,pct])=>{if(pct>0) t+=`• ${SC[sid].name}: ${pct}%\n`;});
  t+='\nCAUSAS RAÍZ DOMINANTES:\n';
  diag.topCR.slice(0,6).forEach(([cr,pct])=>{if(pct>0) t+=`• ${pct}% — ${CR[cr]}\n`;});
  t+='\nSITUACIONES DE ALTA INTENSIDAD:\n';
  aq.forEach(q=>{
    const cs=st.causes[q.id]||[];
    const t2=q.tipo||'';
    const val=st.nd.has(q.id)?'Sin datos':t2==='scale'?`${FREQ.find(f=>f.val===st.ans[q.id])?.label}`:(t2==='yn'||t2==='yn-inv')?(st.ans[q.id]==='si'?'Sí':'No'):`${st.ans[q.id]} ${q.unit||''}`;
    t+=`• ${q.id} — ${q.q}\n  Respuesta: ${val}${cs.length?' | Causas: '+cs.map(c=>CR[c].split(' ').slice(0,4).join(' ')+'...').join(', '):''}\n`;
  });
  t+='\nAnáliza este perfil. Identifica el patrón dominante y diseña la primera regla dura.';
  const ta=document.getElementById('copy-area');
  ta.value=t;ta.select();
  try{document.execCommand('copy');alert('Copiado. Pégalo en el chat de Claude.');}
  catch(e){prompt('Copia este texto:',t);}
}

  const aq=getAlarmQs();
  const date=new Date().toLocaleDateString('es-ES');
  let h=`<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>El Escáner — Diagnóstico</title>

  h+=diag.isStructural

    :`<div class="callout info"><strong>Diagnóstico de micro-fugas</strong> — Tus sistemas base son sólidos. Tu pérdida de rendimiento viene de fugas puntuales.</div>`;

  h+=`<h3>Super-causas — saturación</h3>`;
  diag.topSC.forEach(([sid,pct],i)=>{

    <div style="display:flex;justify-content:space-between;align-items:center">
    <strong style="color:${sv.color}">${i+1}. ${sv.name}</strong>
    <span class="pct" style="color:${col}">${pct}%</span></div>
    ${pct>=40?`<p style="font-size:13px;color:#555;margin:4px 0">El ${pct}% ${SC_FRAME[sid]}</p>`:''}
    <div class="bar-wrap"><div class="bar" style="width:${pct}%;background:${sv.color}"></div></div></div>`;
  });

  h+=`<h3>Causas raíz — vectores dominantes</h3>`;
  diag.topCR.slice(0,6).forEach(([cr,pct])=>{
    if(pct===0) return;

  h+=`<h3>Situaciones de alta intensidad</h3><table><tr><th>#</th><th>Situación</th><th>Respuesta</th></tr>`;
  aq.forEach(q=>{

      (t==='yn'||t==='yn-inv')?(st.ans[q.id]==='si'?'Sí':'No'):`${st.ans[q.id]} ${q.unit||''}`;

function resetAndConfirm(){
  const btn=document.getElementById('reset-btn')||{dataset:{}};
  const el=document.querySelector('[onclick="resetAndConfirm()"]');
  if(el&&el.dataset.warned!=='1'){
    el.dataset.warned='1';
    const orig=el.textContent;
    el.textContent='¿Seguro? Pulsa de nuevo para reiniciar';
    el.style.color='var(--red)';
    setTimeout(()=>{if(el){el.textContent=orig;el.style.color='';el.dataset.warned='0';}},3000);
    return;
  }
  resetState();render();
}
render();
